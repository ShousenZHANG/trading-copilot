name: CI

# Offline core contracts are stdlib-only; real calendars and MCP have pinned dependencies.
# CI's job is to
# prove that on a clean machine, on every supported Python, before a commit
# becomes a directory-pinned release sha.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile every module
        run: python -m compileall -q scripts evals mcps

      - name: Repo health check
        run: python scripts/check.py

      - name: Shared core behavioral contracts
        run: python -m unittest discover -s scripts -p '_test_*.py'

      - name: Self-tests (auto-discovered)
        run: |
          set -euo pipefail
          # Any module exposing --self-test is picked up automatically, so a new
          # module cannot silently ship without CI coverage.
          # -e is required: a bare '--self-test' pattern would be parsed as a
          # grep option, and using '--' to stop parsing swallows --include.
          mapfile -t modules < <(
            grep -rl --include='*.py' --exclude='_test_*.py' -e '--self-test' scripts evals mcps | sort
          )
          if [ ${#modules[@]} -eq 0 ]; then
            echo "::error::no self-testing modules found — discovery is broken"
            exit 1
          fi
          echo "Discovered ${#modules[@]} self-testing module(s):"
          printf '  %s\n' "${modules[@]}"
          echo
          failed=0
          for module in "${modules[@]}"; do
            echo "::group::$module --self-test"
            if python "$module" --self-test; then
              echo "PASS $module"
            else
              echo "::error file=$module::self-test failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

      - name: Integration test suites
        run: |
          python scripts/_test_memory.py
          python scripts/_test_validation.py

      - name: Manifests parse
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in (".mcp.json", ".mcp.json.template",
                       ".claude-plugin/plugin.json", ".claude/settings.json"):
              json.loads(Path(name).read_text(encoding="utf-8"))
              print(f"ok  {name}")
          PY

  runtime:
    name: runtime contracts (MCP handshake + plugin validate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # Pinned exactly: setup-uv stopped publishing moving major tags after v7,
      # so @v10 does not resolve even though v10.0.1 is the latest release.
      - uses: astral-sh/setup-uv@v10.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # The check nothing else in this repo performed. Every other job asserts
      # the SHAPE of a file; these two start real processes. Both shipped MCP
      # servers were unstartable for weeks -- mcp[cli] had no upper bound, the
      # SDK released 2.x, and 2.x deleted mcp.server.fastmcp -- while the entire
      # suite stayed green, because a --self-test is designed to pass without
      # the SDK, without a network and without a running process.
      - name: Every shipped MCP server completes a JSON-RPC handshake
        run: python scripts/mcp_handshake.py --all --timeout 300

      - name: Pinned calendars and real MCP tool persistence
        run: |
          uv run --no-project --with yfinance==1.7.0 --with exchange-calendars==4.13.2 --with tzdata==2026.3 python scripts/_test_market_data.py --calendars
          uv run --no-project --quiet --script scripts/copilot_probe.py

      # The repo checker and the official validator disagreed for a whole
      # release: check.py required a `category` field that `plugin validate`
      # reports as misplaced, while three real schema errors went unnoticed.
      # Run the validator itself so they cannot drift apart again.
      - name: Plugin manifest passes the official validator
        run: |
          npm i -g @anthropic-ai/claude-code@2.1.148
          # Not --strict: it promotes warnings to errors, and this repo carries
          # one by design -- CLAUDE.md at the root is developer context, not
          # plugin content. Real schema errors still exit 1 (verified).
          claude plugin validate .

  lint:
    name: lint (critical errors only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # Pinned: an unpinned linter can fail a release for a rule that did not
      # exist when the commit was written.
      - run: pip install ruff==0.15.15
      # Deliberately the pyflakes critical subset: undefined names, broken
      # f-strings, syntax errors. Real bugs, no style churn — a formatter
      # disagreement must never block a release.
      - run: ruff check --select E9,F63,F7,F82 --output-format github scripts evals mcps

  release-package:
    name: release zip builds + leak check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # package_release.py is allow-list based: a new module can be silently
      # omitted from the zip. Build it on every push and assert the payload.
      - name: Build release zip
        run: python scripts/package_release.py

      - name: Assert shipped payload
        run: |
          python - <<'PY'
          import sys, zipfile
          from pathlib import Path

          zips = sorted(Path("dist").glob("trading-copilot-*.zip"))
          if not zips:
              sys.exit("no release zip produced")
          names = set(zipfile.ZipFile(zips[-1]).namelist())

          required = [
              "scripts/portfolio_check.py", "scripts/trigger_state.py",
              "scripts/benchmarks.py", "scripts/memory.py",
              "scripts/parse_rating.py", "scripts/assemble_report.py",
              "evals/scorer.py", "evals/stockbench/backtest_engine.py",
              "mcps/finnhub_mcp.py", "mcps/akshare_mcp.py",
              "mcps/copilot_mcp.py", "scripts/copilot/service.py",
              ".codex/config.toml", ".codex-plugin/plugin.json", "AGENTS.md",
              ".claude-plugin/plugin.json", "README.md", "DISCLAIMER.md",
          ]
          missing = [r for r in required
                     if not any(n.endswith(r) for n in names)]
          if missing:
              sys.exit("missing from release zip: " + ", ".join(missing))

          # Belt and braces: package_release.py runs its own leak check, but a
          # regression there must not quietly ship personal state.
          leaked = [n for n in names
                    if "positions.md" in n or "trading_memory" in n
                    or n.endswith(".env") or "/data/runs/" in n
                    or "/data/decisions/" in n or "/data/state/" in n
                    or n.endswith((".sqlite", ".sqlite-wal", ".sqlite-shm")) or "portfolio_state.json" in n]
          if leaked:
              sys.exit("personal state leaked into zip: " + ", ".join(leaked))

          print(f"ok  {zips[-1].name}: {len(names)} entries, payload complete, no leaks")
          PY
