# Copy to config/user.toml (gitignored) and edit. Secrets go in .env, never here.
schema_version = 1

[etf]
# 8-12 equity ETFs from the registry in scripts/copilot/instruments.py.
# Bond and gold ETFs are rejected: the ETF sleeve holds equity ETFs and cash only.
universe = ["SPY", "QQQ", "IWM", "VUG", "VTV", "VEA", "VWO", "XLK", "XLV", "XLF"]
# CASH you can deploy into this sleeve, not its market value. Same quantity the
# backtest engine calls start_cash. Set it by hand; the IBKR Flex sync that
# would maintain it is not built.
investable_cash_usd = 0
# Structural cash reserve and drawdown tolerance. Placeholders until a rule is adopted.
min_cash_reserve_pct = 0.15
max_drawdown_pct = 0.20
# Points at a rule recorded by `copilot_cli.py adopt`, which prints the id.
# Nothing writes this file: keeping the pointer manual is what makes adoption an
# explicit act of yours rather than something a daily scan can do. Empty means
# nothing is adopted and the engine produces no orders.
adopted_rule_id = ""

[gold]
investable_total_cny = 0
# Bank of China 积存金 rules verified 2026-09-19: minimum 1200 CNY, top-ups in
# 200 CNY steps, at most 10 buy+sell orders per day on electronic channels.
min_order_cny = 1200
order_increment_cny = 200
max_orders_per_day = 10

[notify]
email_to = ""
timezone = "Australia/Sydney"
# Daily scan after the US close (about 07:00 AEST during US daylight time).
scan_time_local = "07:00"
language = "zh"
