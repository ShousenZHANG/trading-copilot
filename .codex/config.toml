# Generated by scripts/sync_runtimes.py. No credentials or machine paths.

[mcp_servers."yahoo-finance"]
command = "uvx"
args = ["--with", "mcp<2", "yahoo-finance-mcp"]
startup_timeout_sec = 120
tool_timeout_sec = 180

[mcp_servers."finnhub"]
command = "uv"
args = ["run", "--no-project", "--quiet", "--script", "mcps/finnhub_mcp.py"]
env_vars = ["FINNHUB_API_KEY"]
startup_timeout_sec = 120
tool_timeout_sec = 180

[mcp_servers."trading-copilot"]
command = "uv"
args = ["run", "--no-project", "--quiet", "--script", "mcps/copilot_mcp.py"]
env_vars = ["ALPACA_API_KEY", "ALPACA_SECRET_KEY", "APCA_API_KEY_ID", "APCA_API_SECRET_KEY", "COPILOT_DB_PATH", "FINNHUB_API_KEY", "FRED_API_KEY", "SEC_USER_AGENT"]
startup_timeout_sec = 120
tool_timeout_sec = 180

[mcp_servers."trading-copilot".tools.collect_market_snapshot]
approval_mode = "approve"

[mcp_servers."trading-copilot".tools.get_evidence_snapshot]
approval_mode = "approve"

[mcp_servers."trading-copilot".tools.get_investment_context]
approval_mode = "approve"

[mcp_servers."trading-copilot".tools.assess_investment_proposal]
approval_mode = "approve"

[mcp_servers."trading-copilot".tools.record_investment_operation]
approval_mode = "approve"

[mcp_servers."trading-copilot".tools.get_data_capabilities]
approval_mode = "approve"
